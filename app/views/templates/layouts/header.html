<header class="app-header">
  <button class="btn btn-icone d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
          aria-controls="sidebar" aria-label="Abrir menu">
    <i class="bi bi-list"></i>
  </button>
  <div class="app-header-titulos">
    <h1 class="app-header-titulo">{{ cabecalho_titulo }}</h1>
    <p class="app-header-subtitulo">{{ cabecalho_subtitulo }}</p>
  </div>
  <div class="app-header-acoes">
    <span class="selo-fonte" id="selo-fonte" hidden>
      <i class="bi bi-circle-fill" aria-hidden="true"></i>
      <span id="selo-fonte-texto"></span>
    </span>
  </div>
</header>
